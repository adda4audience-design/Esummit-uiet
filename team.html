            {"name": "Rythm", "desig": "Member", "img": "https://res.cloudinary.com/di10wvjn8/image/upload/v1784055110/Image-not-found_fdwm0s.png", "is_leader": false},

            {"name": "Yatin Mantoo", "desig": "Member", "img": "teams/Yatin_Mantoo_No_Desig.jpg", "is_leader": false},
            {"name": "Harshit", "desig": "Member", "img": "teams/Harshit_No_Desig.jpg", "is_leader": false}
          ],
          "Ambassadors": [
          {"name": "Diksha", "desig": "Ambassadors Lead", "img": "teams/Diksha_No_Desig.jpg", "is_leader": true},  
          {"name": "Mahima Aggarwal", "desig": "Member", "img": "teams/Mahima_Aggarwal_No_Desig.jpg", "is_leader": false},
            {"name": "Ankita Gupta", "desig": "Member", "img": "teams/Ankita_Gupta_No_Desig.jpg", "is_leader": false},
            {"name": "Vivek sharma", "desig": "Member", "img": "teams/Vivek_sharma_No_Desig.jpg", "is_leader": false},
            {"name": "Ravi", "desig": "Member", "img": "teams/Ravi_No_Desig.jpg", "is_leader": false},
            {"name": "Manisha", "desig": "Member", "img": "teams/Manisha_No_Desig.jpg", "is_leader": false}
          ]
        };

        
        let camera, sceneWebGL, sceneCSS, rendererWebGL, rendererCSS, controls;
        const objects = []; 
        let activeTeamCards = [];
        let networkLines; 
        
        
        const teamNames = Object.keys(teamData);
        let currentTeamIndex = 0;
        let isScrolling = false;

        init();
        animate();

        
        const hamburger = document.getElementById('hamburger-menu');
        const mainNav = document.getElementById('main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        hamburger.addEventListener('click', function() {
            mainNav.classList.toggle('active');
            if(mainNav.classList.contains('active')) {
                hamburger.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else {
                hamburger.innerHTML = '<i class="fa-solid fa-bars"></i>';
            }
        });

        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('active');
                hamburger.innerHTML = '<i class="fa-solid fa-bars"></i>';
            });
        });

        function init() {
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 20000);
            camera.position.z = 2500; 

            
            sceneWebGL = new THREE.Scene();
            sceneWebGL.fog = new THREE.FogExp2(0x00050f, 0.00035); 
            
            
            const gridHelperBottom = new THREE.GridHelper(10000, 100, 0x00f0ff, 0x00f0ff);
            gridHelperBottom.position.y = -800;
            gridHelperBottom.material.opacity = 0.15;
            gridHelperBottom.material.transparent = true;
            sceneWebGL.add(gridHelperBottom);

            
            const gridHelperTop = new THREE.GridHelper(10000, 100, 0x00f0ff, 0x00f0ff);
            gridHelperTop.position.y = 800;
            gridHelperTop.material.opacity = 0.08;
            gridHelperTop.material.transparent = true;
            sceneWebGL.add(gridHelperTop);

            
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0x00f0ff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending 
            });
            const MAX_LINES = 100; 
            const lineGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(MAX_LINES * 2 * 3); 
            lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            networkLines = new THREE.LineSegments(lineGeo, lineMat);
            sceneWebGL.add(networkLines);

            
            sceneCSS = new THREE.Scene();

            
            rendererWebGL = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            rendererWebGL.setClearColor(0x00030a);
            rendererWebGL.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(rendererWebGL.domElement);

            rendererCSS = new THREE.CSS3DRenderer();
            rendererCSS.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('css-container').appendChild(rendererCSS.domElement);

            
            controls = new THREE.TrackballControls(camera, rendererCSS.domElement);
            controls.minDistance = 1000;
            controls.maxDistance = 5000;
            controls.noPan = true;
            controls.noZoom = true; 
            controls.rotateSpeed = 1.2;

            createCards();
            
            
            document.querySelectorAll('.hud-btn').forEach((btn, index) => {
                btn.addEventListener('click', function() {
                    currentTeamIndex = index;
                    updateActiveTeam();
                });
            });

            
            window.addEventListener('wheel', handleScrollEvent, { passive: false });
            window.addEventListener('resize', onWindowResize);

            filterTeam(teamNames[currentTeamIndex]);
        }

        function createCards() {
            for (const [teamName, members] of Object.entries(teamData)) {
                members.forEach(member => {
                    const el = document.createElement('div');
                    el.className = `team-card ${member.is_leader ? 'leader-card' : 'member-card'}`;
                    
                    let badgeHTML = member.is_leader ? `<div class="leader-badge" title="Team Leader"><i class="fa-solid fa-crown"></i></div>` : '';
                    
                    el.innerHTML = `
                        ${badgeHTML}
                        <div class="card-image-wrapper"><img src="${member.img}" alt="${member.name}" onerror="this.src='https://res.cloudinary.com/di10wvjn8/image/upload/v1784055110/Image-not-found_fdwm0s.png'"></div>
                        <h3>${member.name}</h3>
                        <p>${member.desig}</p>
                    `;

                    const cssObj = new THREE.CSS3DObject(el);
                    cssObj.position.set(0, 0, -10000); 
                    sceneCSS.add(cssObj);
                    
                    objects.push({
                        cssObj: cssObj,
                        team: teamName,
                        isLeader: member.is_leader,
                        targetX: 0,
                        targetY: 0,
                        targetZ: 0
                    });
                });
            }
        }

        
        function handleScrollEvent(e) {
            e.preventDefault(); 
            
            if (isScrolling) return; 
            
            if (e.deltaY > 0) {
                currentTeamIndex = (currentTeamIndex + 1) % teamNames.length;
            } else if (e.deltaY < 0) {
                currentTeamIndex = (currentTeamIndex - 1 + teamNames.length) % teamNames.length;
            }
            
            updateActiveTeam();
            
            isScrolling = true;
            setTimeout(() => { isScrolling = false; }, 800);
        }

        function updateActiveTeam() {
            const nextTeam = teamNames[currentTeamIndex];
            document.querySelectorAll('.hud-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.hud-btn[data-target="${nextTeam}"]`).classList.add('active');
            filterTeam(nextTeam);
        }

        
        function filterTeam(targetTeam) {
            activeTeamCards = [];
            let inactiveCount = 0;
            const inactiveObjects = [];
            let leaderCount = 0;
            let memberCount = 0;

            controls.target.set(0,0,0);

            
            objects.forEach((obj) => {
                if (obj.team === targetTeam) {
                    let index = obj.isLeader ? leaderCount++ : memberCount++;
                    activeTeamCards.push({
                        cssObj: obj.cssObj,
                        isLeader: obj.isLeader,
                        index: index,
                        angleOffset: 0 
                    });
                    
                    
                    obj.cssObj.element.style.opacity = "1";
                    obj.cssObj.element.style.pointerEvents = "auto";
                    obj.cssObj.element.style.filter = "none";
                    obj.cssObj.element.style.zIndex = "10";
                } else {
                    inactiveObjects.push(obj);
                    
                    
                    obj.cssObj.element.style.opacity = "0.5"; 
                    obj.cssObj.element.style.pointerEvents = "none";
                    obj.cssObj.element.style.filter = "blur(10px) brightness(0.7)";
                    obj.cssObj.element.style.zIndex = "1";
                }
            });

            
            activeTeamCards.forEach(card => {
                if (!card.isLeader && memberCount > 0) {
                    card.angleOffset = (card.index / memberCount) * Math.PI * 2;
                }
                card.totalLeaders = leaderCount;
            });

          
            const isMobile = window.innerWidth <= 768;
            const bgRadius = isMobile ? 1000 : 1600; 
            const bgSpread = isMobile ? 200 : 400;
            
            const totalInactive = inactiveObjects.length;
            inactiveObjects.forEach((obj, i) => {
                const phi = Math.acos(-1 + (2 * i) / totalInactive);
                const theta = Math.sqrt(totalInactive * Math.PI) * phi;
                
                const r = bgRadius + Math.random() * bgSpread; 
                
                obj.targetX = r * Math.cos(theta) * Math.sin(phi);
                obj.targetY = r * Math.sin(theta) * Math.sin(phi);
                obj.targetZ = r * Math.cos(phi);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            rendererWebGL.setSize(window.innerWidth, window.innerHeight);
            rendererCSS.setSize(window.innerWidth, window.innerHeight);
        }

        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const time = performance.now() * 0.0005;
            const LERP_SPEED = 0.06; 
            
            const leaderPositions = [];
            const memberPositions = [];

           
            const isMobile = window.innerWidth <= 768;
            const leaderSpread = isMobile ? 220 : 400;   
            const orbitRadius = isMobile ? 450 : 1000;   
            const orbitIncline = isMobile ? 120 : 250;   

            objects.forEach(obj => {
                const activeData = activeTeamCards.find(c => c.cssObj === obj.cssObj);
                let tx, ty, tz;

                if (activeData) {
                    if (activeData.isLeader) {
                        tx = (activeData.index - (activeData.totalLeaders - 1) / 2) * leaderSpread; 
                        ty = Math.sin(time * 2 + activeData.index) * 20;
                        tz = 0;
                    } else {
                        const angle = (time * 0.4) + activeData.angleOffset;
                        
                        tx = Math.cos(angle) * orbitRadius;
                        ty = Math.sin(angle * 2) * orbitIncline; 
                        tz = Math.sin(angle) * orbitRadius;
                    }
                } else {
                    
                    tx = obj.targetX + Math.sin(time + obj.targetX) * 100;
                    ty = obj.targetY + Math.cos(time + obj.targetY) * 100;
                    tz = obj.targetZ;
                }

                
                obj.cssObj.position.x += (tx - obj.cssObj.position.x) * LERP_SPEED;
                obj.cssObj.position.y += (ty - obj.cssObj.position.y) * LERP_SPEED;
                obj.cssObj.position.z += (tz - obj.cssObj.position.z) * LERP_SPEED;

                obj.cssObj.lookAt(camera.position);

                
                if (activeData) {
                    if (activeData.isLeader) leaderPositions.push(obj.cssObj.position.clone());
                    else memberPositions.push(obj.cssObj.position.clone());
                }
            });

            
            const positions = networkLines.geometry.attributes.position.array;
            let pIndex = 0;
            
            if (leaderPositions.length > 0) {
                memberPositions.forEach(mPos => {
                    leaderPositions.forEach(lPos => {
                        
                        for(let offset = -1; offset <= 1; offset++) {
                            positions[pIndex++] = lPos.x + offset*3; positions[pIndex++] = lPos.y + offset*3; positions[pIndex++] = lPos.z;
                            positions[pIndex++] = mPos.x + offset*3; positions[pIndex++] = mPos.y + offset*3; positions[pIndex++] = mPos.z;
                        }
                    });
                });
            } else {
                memberPositions.forEach(mPos => {
                    for(let offset = -1; offset <= 1; offset++) {
                        positions[pIndex++] = offset*3; positions[pIndex++] = offset*3; positions[pIndex++] = 0;
                        positions[pIndex++] = mPos.x + offset*3; positions[pIndex++] = mPos.y + offset*3; positions[pIndex++] = mPos.z;
                    }
                });
            }

            for(let i = pIndex; i < positions.length; i++) {
                positions[i] = 0;
            }
            networkLines.geometry.attributes.position.needsUpdate = true;

            rendererWebGL.render(sceneWebGL, camera);
            rendererCSS.render(sceneCSS, camera);
        }
    </script>
